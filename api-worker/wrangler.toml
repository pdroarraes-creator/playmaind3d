name = "playmind3d-api"
account_id = "11c2a64013fddc0e5a3eb6ffdfaeac08"
main = "src/index.js"
compatibility_date = "2026-08-20"

[vars]
# Orígenes extra para CORS, separados por coma (ej. "http://localhost:8000")
ORIGENES_EXTRA = ""
# Apps Script (URL pública, no es un secreto): verifica sesiones y recibe el snapshot
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiHVXBAnYzs_CBnIuURgBWuTQS0HFFrKExcPiyxviLDAZiLmsgZ0a-9wE8Y2c1yzDy/exec"
# "on" manda una copia de seguridad al Apps Script después de cada save
# En staging SNAPSHOT queda siempre en off: este Worker apunta al Apps Script de producción y, con la chave d1:migrado encendida, un snapshot de staging pisaría la celda de rollback real.
SNAPSHOT = "off"
# "solo-lectura" rechaza las acciones que graban (save, editarPieza, agregarPieza, agregarFilamento) con error "revertido"
MODO = "escritura"

# Configuración de arriba = staging
[[d1_databases]]
binding = "DB"
database_name = "playmind-staging"
database_id = "3e5bd45b-1830-4633-8600-2b5baba6e2af"

# Producción: wrangler deploy --env prod
[env.prod]
name = "playmind3d-api-prod"

[env.prod.vars]
ORIGENES_EXTRA = ""
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiHVXBAnYzs_CBnIuURgBWuTQS0HFFrKExcPiyxviLDAZiLmsgZ0a-9wE8Y2c1yzDy/exec"
SNAPSHOT = "off"
MODO = "escritura"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "playmind-prod"
database_id = "8a0a4cf3-9642-4311-a0ca-763ffbe2f96a"
