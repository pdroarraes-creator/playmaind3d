name = "playmind3d-api"
account_id = "11c2a64013fddc0e5a3eb6ffdfaeac08"
main = "src/index.js"
compatibility_date = "2026-08-20"

[vars]
# Orígenes extra para CORS, separados por coma (ej. "http://localhost:8000")
ORIGENES_EXTRA = ""

# Configuración de arriba = staging
[[d1_databases]]
binding = "DB"
database_name = "playmind-staging"
database_id = "3e5bd45b-1830-4633-8600-2b5baba6e2af"

# Producción: wrangler deploy --env prod
[env.prod]
name = "playmind3d-api-prod"

[env.prod.vars]
ORIGENES_EXTRA = ""

[[env.prod.d1_databases]]
binding = "DB"
database_name = "playmind-prod"
database_id = "8a0a4cf3-9642-4311-a0ca-763ffbe2f96a"
